  <text x="90" y="340" font-family="system-ui, sans-serif" font-size="28" fill="#9aa0ac">Full-Stack Developer &amp; Creative Technologist</text>
  <text x="90" y="400" font-family="ui-monospace, monospace" font-size="16" fill="#4d7fff" letter-spacing="2">BUILDING FAST, INTERACTIVE, PRODUCT-GRADE EXPERIENCES</text>
