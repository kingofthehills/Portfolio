      <stop offset="0%" stop-color="#060609"/>
      <stop offset="60%" stop-color="#120e1f"/>
      <stop offset="100%" stop-color="#1e1638"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8a6cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a6cff" stop-opacity="0"/>
