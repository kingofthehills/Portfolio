      <stop offset="0%" stop-color="#050608"/>
      <stop offset="60%" stop-color="#0c1120"/>
      <stop offset="100%" stop-color="#101b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4d7fff" stop-opacity="0.5"/>
