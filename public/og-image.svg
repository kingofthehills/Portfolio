  <text x="90" y="340" font-family="system-ui, sans-serif" font-size="28" fill="#a2a3b2">Full Stack Developer</text>
  <text x="90" y="400" font-family="ui-monospace, monospace" font-size="16" fill="#fab044" letter-spacing="2">BUILDING FAST, INTERACTIVE, PRODUCT-GRADE EXPERIENCES</text>
